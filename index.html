<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Z-FOOD</title>


  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:10px;

      background:#f6f7f9;

      font-family:
        Arial,
        sans-serif;

      color:#252525;
    }

    .container{
      width:100%;
      max-width:680px;
      margin:auto;
    }


    /* =========================
       HEADER
    ========================= */

    .header{
      background:#fff;

      padding:14px;

      border-radius:12px;

      margin-bottom:10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .title{
      margin:0;

      font-size:22px;

      font-weight:700;

      color:#e87516;
    }

    .subtitle{
      margin-top:3px;

      font-size:11px;

      color:#858585;
    }


    /* =========================
       MASTER STATUS
    ========================= */

    .status{
      display:flex;

      align-items:center;

      gap:8px;

      padding:9px 10px;

      margin-bottom:10px;

      border-radius:8px;

      background:#f1fdf5;

      color:#25834a;

      font-size:12px;

      font-weight:600;
    }

    .dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#24a35a;

      flex:none;
    }


    /* =========================
       SECTION
    ========================= */

    .section{
      background:#fff;

      border-radius:12px;

      padding:12px;

      margin-bottom:10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .section-header{
      display:flex;

      align-items:center;

      justify-content:space-between;

      margin-bottom:10px;
    }

    .section-title{
      font-size:15px;

      font-weight:700;
    }

    .section-count{
      font-size:10px;

      color:#999;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product{
      position:relative;

      padding:10px;

      margin-bottom:8px;

      border:
        1px solid #e8e8e8;

      border-radius:10px;

      background:#fff;
    }

    .product:last-child{
      margin-bottom:8px;
    }


    .product-title{
      padding-right:30px;

      margin-bottom:9px;

      font-size:11px;

      font-weight:700;

      color:#777;
    }


    /* =========================
       REMOVE
    ========================= */

    .remove-btn{
      position:absolute;

      top:8px;
      right:8px;

      width:25px;
      height:25px;

      padding:0;

      border:0;

      border-radius:7px;

      background:#fff0f0;

      color:#d93025;

      font-size:17px;

      line-height:25px;

      cursor:pointer;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-label,
    .quantity-label{
      display:block;

      margin-bottom:4px;

      font-size:10px;

      font-weight:600;

      color:#777;
    }

    .search{
      position:relative;

      margin-bottom:9px;
    }

    .search-input{
      width:100%;

      height:38px;

      padding:
        0 10px;

      border:
        1px solid #ddd;

      border-radius:8px;

      background:#fff;

      outline:none;

      font-size:13px;

      color:#222;
    }

    .search-input:focus{
      border-color:#e87516;

      box-shadow:
        0 0 0 2px
        rgba(232,117,22,.08);
    }


    /* =========================
       DROPDOWN
    ========================= */

    .dropdown{
      display:none;

      position:absolute;

      left:0;
      right:0;

      top:43px;

      z-index:100;

      max-height:190px;

      overflow-y:auto;

      background:#fff;

      border:
        1px solid #ddd;

      border-radius:8px;

      box-shadow:
        0 6px 16px
        rgba(0,0,0,.12);
    }

    .dropdown.show{
      display:block;
    }

    .item{
      padding:9px 10px;

      border-bottom:
        1px solid #f0f0f0;

      cursor:pointer;
    }

    .item:last-child{
      border-bottom:0;
    }

    .item:active{
      background:#fff4e8;
    }

    .item-name{
      font-size:12px;

      font-weight:600;

      line-height:1.35;
    }

    .item-detail{
      margin-top:3px;

      font-size:10px;

      color:#888;

      line-height:1.3;
    }

    .empty{
      padding:12px;

      text-align:center;

      font-size:11px;

      color:#888;
    }


    /* =========================
       QUANTITY
    ========================= */

    .quantity{
      margin-bottom:11px;
    }

    .quantity-input{
      width:100%;

      height:38px;

      padding:
        0 10px;

      border:
        1px solid #ddd;

      border-radius:8px;

      outline:none;

      font-size:13px;

      background:#fff;
    }

    .quantity-input:focus{
      border-color:#e87516;

      box-shadow:
        0 0 0 2px
        rgba(232,117,22,.08);
    }


    /* =========================
       AUTO RESULT
    ========================= */

    .auto-title{
      margin-bottom:5px;

      font-size:10px;

      font-weight:600;

      color:#777;
    }

    .auto-table{
      display:grid;

      grid-template-columns:
        1fr 1.8fr .9fr .7fr;

      border:
        1px solid #e8e8e8;

      border-radius:7px;

      overflow:hidden;

      background:#fff;
    }

    .auto-cell{
      min-width:0;

      padding:7px 6px;

      border-right:
        1px solid #e8e8e8;

      font-size:10px;

      line-height:1.3;

      word-break:break-word;
    }

    .auto-cell:nth-child(4n){
      border-right:0;
    }

    .auto-head{
      background:#f7f7f7;

      font-weight:700;

      color:#777;
    }

    .auto-value{
      min-height:30px;

      display:flex;

      align-items:center;

      font-weight:600;

      color:#333;
    }


    /* =========================
       ADD PRODUCT
    ========================= */

    .add-btn{
      width:100%;

      height:36px;

      border:
        1px dashed #e87516;

      border-radius:8px;

      background:#fffaf5;

      color:#e87516;

      font-size:12px;

      font-weight:700;

      cursor:pointer;
    }

    .add-btn:active{
      transform:scale(.99);
    }


    /* =========================
       EMPTY
    ========================= */

    .section-empty{
      padding:10px;

      margin-bottom:8px;

      border-radius:8px;

      background:#f8f9fa;

      text-align:center;

      font-size:11px;

      color:#999;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:430px){

      body{
        padding:8px;
      }

      .header{
        padding:13px;
      }

      .section{
        padding:10px;
      }

      .product{
        padding:9px;
      }

      .auto-cell{
        padding:7px 5px;

        font-size:9px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">

    <h1 class="title">
      Z-FOOD
    </h1>

    <div class="subtitle">
      Product Conversion
    </div>

  </div>


  <!-- =========================
       MASTER STATUS
  ========================== -->

  <div class="status">

    <span class="dot"></span>

    <span id="masterStatus">
      Menghubungkan ke Master...
    </span>

  </div>


  <!-- =========================
       PRODUK AWAL
  ========================== -->

  <div class="section">

    <div class="section-header">

      <div class="section-title">
        PRODUK AWAL
      </div>

      <div
        id="awalCount"
        class="section-count"
      >
        0 produk
      </div>

    </div>


    <div id="awalList"></div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('awal')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <!-- =========================
       PRODUK AKHIR
  ========================== -->

  <div class="section">

    <div class="section-header">

      <div class="section-title">
        PRODUK AKHIR
      </div>

      <div
        id="akhirCount"
        class="section-count"
      >
        0 produk
      </div>

    </div>


    <div id="akhirList"></div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('akhir')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


</div>


<script>


/* =====================================================
   APPS SCRIPT BACKEND
===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzVdHeD20QG6_gZmm23TdNgBIEdVSOkiBwxoIWy-Nmt9a_3GTJUWcHCcuDkQb-MxmCygw/exec';


/* =====================================================
   MASTER
===================================================== */

let MASTER_DATA = [];


/* =====================================================
   COUNTER
===================================================== */

let awalCounter = 0;

let akhirCounter = 0;


/* =====================================================
   LOAD MASTER
===================================================== */

function loadMaster(){

  const callbackName =
    '__zfood_master_' +
    Date.now();


  let finished = false;


  window[callbackName] =
    function(response){

      if(finished){
        return;
      }

      finished = true;


      try{

        delete window[callbackName];


        if(
          !response ||
          response.success !== true
        ){

          showMasterError(
            response &&
            response.error
              ? response.error
              : 'Master tidak dapat dimuat.'
          );

          return;
        }


        MASTER_DATA =
          Array.isArray(response.data)
            ? response.data
            : [];


        document.getElementById(
          'masterStatus'
        ).textContent =
          'Master terhubung • ' +
          MASTER_DATA.length.toLocaleString(
            'id-ID'
          ) +
          ' data';


        /*
         * Produk awal dan akhir
         * pertama dibuat otomatis
         */

        addProduct('awal');

        addProduct('akhir');


      }catch(error){

        showMasterError(
          error.message
        );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    APPS_SCRIPT_URL +
    '?callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  script.async = true;


  script.onerror =
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showMasterError(
        'Gagal menghubungi Apps Script.'
      );

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showMasterError(
        'Koneksi Master timeout.'
      );

    },
    20000
  );

}


/* =====================================================
   MASTER ERROR
===================================================== */

function showMasterError(message){

  document.getElementById(
    'masterStatus'
  ).textContent =
    message;

  document.querySelector(
    '.status'
  ).style.background =
    '#fff0f0';

  document.querySelector(
    '.status'
  ).style.color =
    '#c62828';

  document.querySelector(
    '.dot'
  ).style.background =
    '#d93025';

}


/* =====================================================
   TAMBAH PRODUK
===================================================== */

function addProduct(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const id =
    type === 'awal'
      ? ++awalCounter
      : ++akhirCounter;


  const product =
    document.createElement(
      'div'
    );


  product.className =
    'product';


  product.dataset.type =
    type;


  product.dataset.id =
    id;


  product.innerHTML = `

    <button
      type="button"
      class="remove-btn"
      onclick="removeProduct(this)"
      title="Hapus produk"
    >
      ×
    </button>


    <div class="product-title">
      ${type === 'awal'
        ? 'PRODUK AWAL'
        : 'PRODUK AKHIR'}
      #${id}
    </div>


    <!-- PENCARIAN -->

    <div class="search">

      <label class="search-label">
        ARTICLE / BARCODE / NAMA BARANG
      </label>

      <input
        type="text"
        class="search-input"
        placeholder="Ketik atau scan..."
        autocomplete="off"
        oninput="searchProduct(this)"
        onclick="searchProduct(this)"
      >

      <div class="dropdown"></div>

    </div>


    <!-- QUANTITY -->

    <div class="quantity">

      <label class="quantity-label">
        QUANTITY
      </label>

      <input
        type="number"
        class="quantity-input"
        inputmode="decimal"
        step="any"
        placeholder="Masukkan quantity"
        oninput="updateQuantity(this)"
      >

    </div>


    <!-- HASIL OTOMATIS -->

    <div class="auto-title">
      DATA PRODUK
    </div>


    <div class="auto-table">


      <!-- HEADER -->

      <div class="auto-cell auto-head">
        ARTICLE
      </div>

      <div class="auto-cell auto-head">
        NAMA BARANG
      </div>

      <div class="auto-cell auto-head">
        QUANTITY
      </div>

      <div class="auto-cell auto-head">
        OUM
      </div>


      <!-- VALUE -->

      <div
        class="auto-cell auto-value result-article"
      >
        -
      </div>

      <div
        class="auto-cell auto-value result-name"
      >
        -
      </div>

      <div
        class="auto-cell auto-value result-quantity"
      >
        -
      </div>

      <div
        class="auto-cell auto-value result-oum"
      >
        -
      </div>


    </div>

  `;


  list.appendChild(
    product
  );


  updateCount(
    type
  );

}


/* =====================================================
   HAPUS PRODUK
===================================================== */

function removeProduct(button){

  const product =
    button.closest(
      '.product'
    );


  if(!product){
    return;
  }


  const type =
    product.dataset.type;


  product.remove();


  updateCount(
    type
  );

}


/* =====================================================
   COUNT
===================================================== */

function updateCount(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const count =
    list.querySelectorAll(
      '.product'
    ).length;


  document.getElementById(
    type === 'awal'
      ? 'awalCount'
      : 'akhirCount'
  ).textContent =
    count +
    ' ' +
    (count === 1
      ? 'produk'
      : 'produk');

}


/* =====================================================
   SEARCH PRODUK
===================================================== */

function searchProduct(input){

  const keyword =
    input.value
      .trim()
      .toLowerCase();


  const product =
    input.closest(
      '.product'
    );


  const dropdown =
    product.querySelector(
      '.dropdown'
    );


  if(!keyword){

    dropdown.classList.remove(
      'show'
    );

    return;
  }


  const results =
    MASTER_DATA

      .filter(
        function(item){

          return (

            String(
              item.artikel || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.barcode || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.nama || ''
            )
              .toLowerCase()
              .includes(keyword)

          );

        }
      )

      .slice(
        0,
        30
      );


  dropdown.innerHTML =
    '';


  if(!results.length){

    dropdown.innerHTML =
      '<div class="empty">' +
      'Produk tidak ditemukan' +
      '</div>';

    dropdown.classList.add(
      'show'
    );

    return;
  }


  results.forEach(
    function(item){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'item';


      div.innerHTML =

        '<div class="item-name">' +
        escapeHTML(
          item.nama || '-'
        ) +
        '</div>' +

        '<div class="item-detail">' +
        'Article: ' +
        escapeHTML(
          item.artikel || '-'
        ) +
        ' &nbsp; | &nbsp; ' +
        'Barcode: ' +
        escapeHTML(
          item.barcode || '-'
        ) +
        ' &nbsp; | &nbsp; ' +
        'OUM: ' +
        escapeHTML(
          item.oum || '-'
        ) +
        '</div>';


      div.addEventListener(
        'click',
        function(event){

          event.stopPropagation();

          selectProduct(
            product,
            item
          );

        }
      );


      dropdown.appendChild(
        div
      );

    }
  );


  dropdown.classList.add(
    'show'
  );

}


/* =====================================================
   PILIH PRODUK
===================================================== */

function selectProduct(
  product,
  item
){

  const searchInput =
    product.querySelector(
      '.search-input'
    );


  const quantityInput =
    product.querySelector(
      '.quantity-input'
    );


  /*
   * Article ditampilkan
   * sebagai nilai pencarian
   */

  searchInput.value =
    item.artikel || '';


  /*
   * Simpan data Master
   */

  product.dataset.article =
    item.artikel || '';

  product.dataset.barcode =
    item.barcode || '';

  product.dataset.name =
    item.nama || '';

  product.dataset.oum =
    item.oum || '';


  /*
   * Hasil otomatis
   */

  product.querySelector(
    '.result-article'
  ).textContent =
    item.artikel || '-';


  product.querySelector(
    '.result-name'
  ).textContent =
    item.nama || '-';


  product.querySelector(
    '.result-oum'
  ).textContent =
    item.oum || '-';


  /*
   * Quantity tetap mengikuti
   * input manual.
   */

  product.querySelector(
    '.result-quantity'
  ).textContent =
    quantityInput.value || '-';


  /*
   * Tutup dropdown
   */

  product.querySelector(
    '.dropdown'
  ).classList.remove(
    'show'
  );

}


/* =====================================================
   UPDATE QUANTITY
===================================================== */

function updateQuantity(input){

  const product =
    input.closest(
      '.product'
    );


  if(!product){
    return;
  }


  product.querySelector(
    '.result-quantity'
  ).textContent =
    input.value || '-';

}


/* =====================================================
   CLOSE DROPDOWN
===================================================== */

document.addEventListener(
  'click',
  function(event){

    if(
      !event.target.closest(
        '.search'
      )
    ){

      document
        .querySelectorAll(
          '.dropdown'
        )
        .forEach(
          function(dropdown){

            dropdown.classList.remove(
              'show'
            );

          }
        );

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   START
===================================================== */

loadMaster();

</script>


</body>

</html>
