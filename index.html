<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Z-FOOD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#252a31;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:680px;
  margin:auto;
  padding:9px 8px 20px;
}

/* HEADER */
.header{
  background:#fff;
  border:1px solid #e8eaed;
  border-radius:12px;
  padding:11px 12px;
  margin-bottom:8px;
  box-shadow:0 3px 10px rgba(0,0,0,.035);
}

.header h1{
  font-size:18px;
  font-weight:700;
}

.header p{
  margin-top:2px;
  font-size:11px;
  color:#7a818a;
}

/* SECTION */
.section{
  background:#fff;
  border:1px solid #e8eaed;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
  box-shadow:0 3px 10px rgba(0,0,0,.035);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:7px;
}

.section-title h2{
  font-size:13px;
  font-weight:700;
}

.badge{
  font-size:9px;
  padding:4px 7px;
  border-radius:20px;
  background:#f1f3f5;
  color:#666d76;
}

/* LIST */
.product-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

/* CARD */
.product-card{
  position:relative;
  background:#fafbfc;
  border:1px solid #e5e8ec;
  border-radius:9px;
  padding:8px;
}

.product-number{
  font-size:9px;
  color:#8a9199;
  margin-bottom:6px;
  font-weight:600;
}

.field{
  margin-bottom:7px;
}

.field:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-size:9px;
  font-weight:600;
  color:#606872;
  margin-bottom:3px;
}

input{
  width:100%;
  height:32px;
  border:1px solid #dfe3e7;
  border-radius:7px;
  background:#fff;
  padding:0 9px;
  font-size:12px;
  outline:none;
  color:#252a31;
}

input:focus{
  border-color:#e97818;
  box-shadow:0 0 0 2px rgba(233,120,24,.09);
}

input[readonly]{
  background:#f3f4f6;
  color:#555d66;
}

/* SEARCH */
.article-wrap{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  top:36px;
  max-height:160px;
  overflow-y:auto;
  background:#fff;
  border:1px solid #dfe3e7;
  border-radius:8px;
  box-shadow:0 6px 15px rgba(0,0,0,.09);
  display:none;
}

.suggestion{
  padding:8px 10px;
  border-bottom:1px solid #f0f1f2;
  cursor:pointer;
}

.suggestion:last-child{
  border-bottom:none;
}

.suggestion:hover{
  background:#fff7ef;
}

.suggestion strong{
  display:block;
  font-size:11px;
  font-weight:700;
}

.suggestion span{
  display:block;
  margin-top:2px;
  font-size:9px;
  color:#858c94;
}

/* TWO COLUMNS */
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

/* REMOVE */
.remove-btn{
  position:absolute;
  right:7px;
  top:7px;
  width:23px;
  height:23px;
  border:0;
  border-radius:6px;
  background:#fff0f0;
  color:#d94a4a;
  cursor:pointer;
  font-size:14px;
  line-height:23px;
}

/* ADD */
.add-btn{
  width:100%;
  height:34px;
  margin-top:8px;
  border:1px dashed #e7a56e;
  border-radius:8px;
  background:#fffaf5;
  color:#df6d0b;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

/* SUBMIT */
.submit-btn{
  width:100%;
  height:39px;
  border:0;
  border-radius:9px;
  background:#e87516;
  color:#fff;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(232,117,22,.18);
}

.footer{
  text-align:center;
  font-size:9px;
  color:#9aa0a7;
  margin-top:11px;
}

/* STATUS */
.master-status{
  font-size:9px;
  margin-top:4px;
  color:#858c94;
}

@media(max-width:480px){

  .container{
    padding:9px 8px 20px;
  }

  .header h1{
    font-size:18px;
  }

  .section{
    padding:10px;
  }

  input{
    height:32px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Z-FOOD</h1>
    <p>Product Conversion Form</p>
    <div id="masterStatus" class="master-status">
      Memuat data Master...
    </div>
  </div>


  <!-- PRODUK AWAL -->
  <div class="section">

    <div class="section-title">
      <h2>PRODUK AWAL</h2>
      <span class="badge" id="awalCount">0 Item</span>
    </div>

    <div id="awalList" class="product-list"></div>

    <button
      class="add-btn"
      onclick="addProduct('awal')">
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <!-- PRODUK AKHIR -->
  <div class="section">

    <div class="section-title">
      <h2>PRODUK AKHIR</h2>
      <span class="badge" id="akhirCount">0 Item</span>
    </div>

    <div id="akhirList" class="product-list"></div>

    <button
      class="add-btn"
      onclick="addProduct('akhir')">
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <button
    class="submit-btn"
    onclick="submitData()">
    SIMPAN DATA
  </button>


  <div class="footer">
    Z-FOOD • 2026
  </div>

</div>


<script>

/* =========================================
   URL DEPLOYMENT APPS SCRIPT
========================================= */

const MASTER_API =
"https://script.google.com/macros/s/AKfycbzVdHeD20QG6_gZmm23TdNgBIEdVSOkiBwxoIWy-Nmt9a_3GTJUWcHCcuDkQb-MxmCygw/exec";


/* =========================================
   MASTER
========================================= */

let MASTER = [];

let masterReady = false;

let productId = 0;


/* =========================================
   LOAD MASTER
========================================= */

async function loadMaster(){

  const status =
    document.getElementById("masterStatus");

  try{

    status.textContent =
      "Memuat data Master...";


    const response =
      await fetch(MASTER_API, {
        method:"GET",
        cache:"no-store"
      });


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "Format data Master tidak valid."
      );

    }


    MASTER = data;

    masterReady = true;


    status.textContent =
      "Master: " +
      MASTER.length.toLocaleString("id-ID") +
      " produk";


    console.log(
      "MASTER LOADED:",
      MASTER.length
    );


  }catch(error){

    console.error(error);

    status.textContent =
      "Master gagal dimuat";


    alert(
      "Gagal mengambil data Master.\n\n" +
      error.message
    );

  }

}


/* =========================================
   ADD PRODUCT
========================================= */

function addProduct(type){

  productId++;


  const list =
    document.getElementById(
      type === "awal"
      ? "awalList"
      : "akhirList"
    );


  const card =
    document.createElement("div");


  card.className =
    "product-card";


  card.innerHTML = `

    <button
      class="remove-btn"
      onclick="removeProduct(this,'${type}')">
      ×
    </button>


    <div class="product-number">
      PRODUK #${getCount(type) + 1}
    </div>


    <div class="field">

      <label>
        ARTICLE / BARCODE
      </label>


      <div class="article-wrap">

        <input
          type="text"
          class="article-input"
          placeholder="Ketik article / barcode"
          autocomplete="off"
          oninput="searchArticle(this)"
        >


        <div class="suggestions"></div>

      </div>

    </div>


    <div class="field">

      <label>
        NAMA BARANG
      </label>


      <input
        type="text"
        class="name-input"
        placeholder="Otomatis"
        readonly>

    </div>


    <div class="row">

      <div class="field">

        <label>
          QUANTITY
        </label>


        <input
          type="number"
          class="qty-input"
          min="0"
          step="any"
          placeholder="0">

      </div>


      <div class="field">

        <label>
          OUM
        </label>


        <input
          type="text"
          class="oum-input"
          placeholder="Otomatis"
          readonly>

      </div>

    </div>
  `;


  list.appendChild(card);

  updateCount(type);

}


/* =========================================
   COUNT
========================================= */

function getCount(type){

  const list =
    document.getElementById(
      type === "awal"
      ? "awalList"
      : "akhirList"
    );

  return list.children.length;

}


function updateCount(type){

  const count =
    getCount(type);


  document.getElementById(
    type === "awal"
    ? "awalCount"
    : "akhirCount"
  ).textContent =
    count + " Item";

}


/* =========================================
   SEARCH ARTICLE / BARCODE
========================================= */

function searchArticle(input){

  const value =
    input.value
      .trim()
      .toLowerCase();


  const wrap =
    input.closest(".article-wrap");


  const box =
    wrap.querySelector(".suggestions");


  if(!value){

    box.innerHTML = "";

    box.style.display = "none";

    clearProduct(input);

    return;

  }


  if(!masterReady){

    box.innerHTML = `
      <div class="suggestion">
        <span>Memuat data Master...</span>
      </div>
    `;

    box.style.display = "block";

    return;

  }


  const results =
    MASTER
      .filter(item => {

        const article =
          String(item.artikel || "")
            .toLowerCase();


        const barcode =
          String(item.barcode || "")
            .toLowerCase();


        const nama =
          String(item.nama || "")
            .toLowerCase();


        return (
          article.includes(value) ||
          barcode.includes(value) ||
          nama.includes(value)
        );

      })
      .slice(0,30);


  if(!results.length){

    box.innerHTML = `
      <div class="suggestion">
        <span>Produk tidak ditemukan</span>
      </div>
    `;

    box.style.display = "block";

    return;

  }


  box.innerHTML =
    results
      .map((item,index) => `

        <div
          class="suggestion"
          onclick="selectArticleByIndex(this,${index})">

          <strong>
            ${escapeHtml(item.nama)}
          </strong>

          <span>
            Article:
            ${escapeHtml(item.artikel)}
            ${item.barcode
              ? " • Barcode: " +
                escapeHtml(item.barcode)
              : ""}
            •
            ${escapeHtml(item.oum)}
          </span>

        </div>

      `)
      .join("");


  /*
    Simpan hasil pencarian sementara
    pada element dropdown.
  */

  box._results = results;


  box.style.display = "block";

}


/* =========================================
   SELECT PRODUCT
========================================= */

function selectArticleByIndex(
  element,
  index
){

  const box =
    element.closest(".suggestions");


  const item =
    box._results[index];


  if(!item) return;


  const card =
    element.closest(".product-card");


  card.querySelector(
    ".article-input"
  ).value =
    item.artikel || "";


  card.querySelector(
    ".name-input"
  ).value =
    item.nama || "";


  card.querySelector(
    ".oum-input"
  ).value =
    item.oum || "";


  box.innerHTML = "";

  box.style.display = "none";

}


/* =========================================
   CLEAR
========================================= */

function clearProduct(input){

  const card =
    input.closest(".product-card");


  card.querySelector(
    ".name-input"
  ).value = "";


  card.querySelector(
    ".oum-input"
  ).value = "";

}


/* =========================================
   REMOVE
========================================= */

function removeProduct(
  button,
  type
){

  const card =
    button.closest(".product-card");


  card.remove();


  updateCount(type);

  renumber(type);

}


/* =========================================
   RENUMBER
========================================= */

function renumber(type){

  const list =
    document.getElementById(
      type === "awal"
      ? "awalList"
      : "akhirList"
    );


  [...list.children]
    .forEach((card,index)=>{

      card.querySelector(
        ".product-number"
      ).textContent =
        "PRODUK #" + (index + 1);

    });

}


/* =========================================
   COLLECT DATA
========================================= */

function collectData(type){

  const list =
    document.getElementById(
      type === "awal"
      ? "awalList"
      : "akhirList"
    );


  return [...list.children]
    .map(card => ({

      artikel:
        card.querySelector(
          ".article-input"
        ).value.trim(),

      nama:
        card.querySelector(
          ".name-input"
        ).value.trim(),

      quantity:
        card.querySelector(
          ".qty-input"
        ).value,

      oum:
        card.querySelector(
          ".oum-input"
        ).value.trim()

    }));

}


/* =========================================
   SUBMIT
========================================= */

function submitData(){

  const awal =
    collectData("awal");


  const akhir =
    collectData("akhir");


  if(
    awal.length === 0 &&
    akhir.length === 0
  ){

    alert(
      "Belum ada produk yang dimasukkan."
    );

    return;

  }


  console.log({

    produkAwal:awal,

    produkAkhir:akhir

  });


  alert(
    "Data berhasil dikumpulkan.\n\n" +
    "Produk Awal: " +
    awal.length +
    "\nProduk Akhir: " +
    akhir.length
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   CLOSE DROPDOWN
========================================= */

document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(
        ".article-wrap"
      )
    ){

      document
        .querySelectorAll(
          ".suggestions"
        )
        .forEach(box => {

          box.style.display =
            "none";

        });

    }

  }
);


/* =========================================
   START
========================================= */

addProduct("awal");

addProduct("akhir");

loadMaster();

</script>

</body>
</html>
