<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Z-FOOD</title>


  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:10px;

      background:#f6f7f9;

      font-family:
        Arial,
        sans-serif;

      color:#252525;
    }


    .container{
      width:100%;
      max-width:680px;
      margin:auto;
    }


    /* =========================
       HEADER
    ========================= */

    .header{
      background:#fff;

      padding:14px;

      border-radius:12px;

      margin-bottom:10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .title{
      margin:0;

      font-size:22px;

      font-weight:700;

      color:#e87516;
    }

    .subtitle{
      margin-top:3px;

      font-size:11px;

      color:#858585;
    }


    /* =========================
       CARD
    ========================= */

    .card{
      background:#fff;

      padding:12px;

      border-radius:12px;

      margin-bottom:10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }


    /* =========================
       STATUS
    ========================= */

    .status{
      display:flex;

      align-items:center;

      gap:8px;

      padding:9px 10px;

      border-radius:8px;

      background:#f1fdf5;

      color:#25834a;

      font-size:12px;

      font-weight:600;

      margin-bottom:12px;
    }

    .dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#24a35a;

      flex:none;
    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title{
      display:flex;

      align-items:center;

      justify-content:space-between;

      margin-bottom:10px;
    }

    .section-title strong{
      font-size:14px;
    }

    .section-title span{
      font-size:10px;

      color:#999;
    }


    /* =========================
       PRODUCT CARD
    ========================= */

    .product{
      position:relative;

      padding:10px;

      border:
        1px solid #ececec;

      border-radius:10px;

      margin-bottom:8px;

      background:#fff;
    }


    .product-number{
      font-size:11px;

      font-weight:700;

      color:#777;

      margin-bottom:7px;
    }


    /* =========================
       SEARCH
    ========================= */

    .search{
      position:relative;

      margin-bottom:8px;
    }

    .search input{
      width:100%;

      height:38px;

      padding:
        0 10px;

      border:
        1px solid #ddd;

      border-radius:8px;

      outline:none;

      font-size:13px;

      background:#fff;
    }

    .search input:focus{
      border-color:#e87516;
    }


    .dropdown{
      display:none;

      position:absolute;

      left:0;
      right:0;

      top:42px;

      z-index:50;

      background:#fff;

      border:
        1px solid #ddd;

      border-radius:8px;

      box-shadow:
        0 5px 15px rgba(0,0,0,.12);

      max-height:190px;

      overflow-y:auto;
    }

    .dropdown.show{
      display:block;
    }


    .item{
      padding:8px 10px;

      border-bottom:
        1px solid #f0f0f0;

      cursor:pointer;
    }

    .item:last-child{
      border-bottom:0;
    }

    .item:active{
      background:#fff4e8;
    }


    .item-name{
      font-size:12px;

      font-weight:600;

      line-height:1.3;
    }

    .item-detail{
      margin-top:2px;

      font-size:10px;

      color:#888;

      line-height:1.3;
    }

    .empty{
      padding:10px;

      text-align:center;

      font-size:11px;

      color:#888;
    }


    /* =========================
       FIELDS
    ========================= */

    .fields{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:8px;
    }

    .field label{
      display:block;

      margin-bottom:4px;

      font-size:10px;

      color:#777;
    }

    .field input{
      width:100%;

      height:35px;

      padding:
        0 9px;

      border:
        1px solid #e2e2e2;

      border-radius:7px;

      background:#f8f9fa;

      font-size:12px;

      outline:none;
    }

    .field input:disabled{
      color:#333;

      opacity:1;
    }


    /* =========================
       DELETE
    ========================= */

    .remove{
      position:absolute;

      top:8px;
      right:8px;

      width:24px;
      height:24px;

      border:0;

      border-radius:7px;

      background:#fff0f0;

      color:#d93025;

      font-size:16px;

      line-height:1;

      cursor:pointer;
    }


    /* =========================
       ADD BUTTON
    ========================= */

    .add-btn{
      width:100%;

      height:36px;

      border:
        1px dashed #e87516;

      border-radius:8px;

      background:#fffaf5;

      color:#e87516;

      font-size:12px;

      font-weight:700;

      cursor:pointer;
    }

    .add-btn:active{
      transform:scale(.99);
    }


    /* =========================
       INFO
    ========================= */

    .info{
      margin-top:8px;

      text-align:center;

      font-size:10px;

      color:#999;
    }


    @media(max-width:420px){

      body{
        padding:8px;
      }

      .fields{
        grid-template-columns:
          1fr 1fr;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1 class="title">
      Z-FOOD
    </h1>

    <div class="subtitle">
      Product Conversion
    </div>

  </div>


  <!-- MASTER STATUS -->

  <div class="status">

    <span class="dot"></span>

    <span id="masterStatus">
      Menghubungkan ke Master...
    </span>

  </div>


  <!-- =========================
       PRODUK AWAL
  ========================== -->

  <div class="card">

    <div class="section-title">

      <strong>
        PRODUK AWAL
      </strong>

      <span id="awalCount">
        0 produk
      </span>

    </div>


    <div id="awalList"></div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('awal')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <!-- =========================
       PRODUK AKHIR
  ========================== -->

  <div class="card">

    <div class="section-title">

      <strong>
        PRODUK AKHIR
      </strong>

      <span id="akhirCount">
        0 produk
      </span>

    </div>


    <div id="akhirList"></div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('akhir')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <div class="info">
    Master dimuat satu kali untuk mempercepat pencarian.
  </div>


</div>


<script>


/* =====================================================
   APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzVdHeD20QG6_gZmm23TdNgBIEdVSOkiBwxoIWy-Nmt9a_3GTJUWcHCcuDkQb-MxmCygw/exec';


/* =====================================================
   MASTER DATA
===================================================== */

let MASTER_DATA = [];


/* =====================================================
   PRODUCT COUNTER
===================================================== */

let awalCounter = 0;

let akhirCounter = 0;


/* =====================================================
   LOAD MASTER
===================================================== */

function loadMaster(){

  const callbackName =
    '__zfood_' + Date.now();


  let finished = false;


  window[callbackName] =
    function(response){

      if(finished){
        return;
      }

      finished = true;


      try{

        delete window[callbackName];


        if(
          !response ||
          response.success !== true
        ){

          showMasterError(
            response &&
            response.error
              ? response.error
              : 'Master tidak dapat dimuat.'
          );

          return;
        }


        MASTER_DATA =
          Array.isArray(response.data)
            ? response.data
            : [];


        document.getElementById(
          'masterStatus'
        ).textContent =
          'Master terhubung • ' +
          MASTER_DATA.length.toLocaleString(
            'id-ID'
          ) +
          ' data';


        /*
         * Tambahkan 1 produk awal
         * dan 1 produk akhir
         */

        addProduct('awal');

        addProduct('akhir');


      }catch(error){

        showMasterError(
          error.message
        );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    APPS_SCRIPT_URL +
    '?callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  script.async = true;


  script.onerror =
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showMasterError(
        'Gagal menghubungi Apps Script.'
      );

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showMasterError(
        'Koneksi Master timeout.'
      );

    },
    20000
  );

}


/* =====================================================
   MASTER ERROR
===================================================== */

function showMasterError(message){

  const status =
    document.getElementById(
      'masterStatus'
    );

  status.textContent =
    message;

  status.style.color =
    '#c62828';

}


/* =====================================================
   ADD PRODUCT
===================================================== */

function addProduct(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const id =
    type === 'awal'
      ? ++awalCounter
      : ++akhirCounter;


  const product =
    document.createElement(
      'div'
    );


  product.className =
    'product';


  product.dataset.type =
    type;


  product.dataset.id =
    id;


  product.innerHTML = `

    <button
      type="button"
      class="remove"
      onclick="removeProduct(this)"
    >
      ×
    </button>


    <div class="product-number">
      ${type === 'awal'
        ? 'PRODUK AWAL'
        : 'PRODUK AKHIR'}
      #${id}
    </div>


    <div class="search">

      <input
        type="text"
        class="article-input"
        placeholder="ARTICLE / BARCODE / NAMA BARANG"
        autocomplete="off"
        oninput="searchProduct(this)"
        onclick="searchProduct(this)"
      >

      <div class="dropdown"></div>

    </div>


    <div class="fields">

      <div class="field">

        <label>
          NAMA BARANG
        </label>

        <input
          type="text"
          class="name-input"
          readonly
          placeholder="-"
        >

      </div>


      <div class="field">

        <label>
          OUM
        </label>

        <input
          type="text"
          class="oum-input"
          readonly
          placeholder="-"
        >

      </div>


      <div class="field">

        <label>
          QUANTITY
        </label>

        <input
          type="number"
          class="qty-input"
          inputmode="decimal"
          step="any"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label>
          ARTICLE
        </label>

        <input
          type="text"
          class="selected-article"
          readonly
          placeholder="-"
        >

      </div>

    </div>

  `;


  list.appendChild(
    product
  );


  updateCount(
    type
  );

}


/* =====================================================
   REMOVE PRODUCT
===================================================== */

function removeProduct(button){

  const product =
    button.closest(
      '.product'
    );


  if(!product){
    return;
  }


  const type =
    product.dataset.type;


  product.remove();


  updateCount(
    type
  );

}


/* =====================================================
   UPDATE COUNT
===================================================== */

function updateCount(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const count =
    list.querySelectorAll(
      '.product'
    ).length;


  document.getElementById(
    type === 'awal'
      ? 'awalCount'
      : 'akhirCount'
  ).textContent =
    count +
    (count === 1
      ? ' produk'
      : ' produk');

}


/* =====================================================
   SEARCH PRODUCT
===================================================== */

function searchProduct(input){

  const keyword =
    input.value
      .trim()
      .toLowerCase();


  const product =
    input.closest(
      '.product'
    );


  const dropdown =
    product.querySelector(
      '.dropdown'
    );


  if(!keyword){

    dropdown.classList.remove(
      'show'
    );

    return;
  }


  const results =
    MASTER_DATA
      .filter(
        function(item){

          return (

            String(
              item.artikel || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.barcode || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.nama || ''
            )
              .toLowerCase()
              .includes(keyword)

          );

        }
      )
      .slice(0,30);


  dropdown.innerHTML =
    '';


  if(!results.length){

    dropdown.innerHTML =
      '<div class="empty">' +
      'Produk tidak ditemukan' +
      '</div>';

    dropdown.classList.add(
      'show'
    );

    return;
  }


  results.forEach(
    function(item){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'item';


      div.innerHTML =

        '<div class="item-name">' +
        escapeHTML(
          item.nama || '-'
        ) +
        '</div>' +

        '<div class="item-detail">' +
        'Article: ' +
        escapeHTML(
          item.artikel || '-'
        ) +
        ' | Barcode: ' +
        escapeHTML(
          item.barcode || '-'
        ) +
        ' | OUM: ' +
        escapeHTML(
          item.oum || '-'
        ) +
        '</div>';


      div.addEventListener(
        'click',
        function(event){

          event.stopPropagation();

          selectProduct(
            product,
            item
          );

        }
      );


      dropdown.appendChild(
        div
      );

    }
  );


  dropdown.classList.add(
    'show'
  );

}


/* =====================================================
   SELECT PRODUCT
===================================================== */

function selectProduct(
  product,
  item
){

  const articleInput =
    product.querySelector(
      '.article-input'
    );


  const nameInput =
    product.querySelector(
      '.name-input'
    );


  const oumInput =
    product.querySelector(
      '.oum-input'
    );


  const selectedArticle =
    product.querySelector(
      '.selected-article'
    );


  articleInput.value =
    item.artikel || '';


  nameInput.value =
    item.nama || '';


  oumInput.value =
    item.oum || '';


  selectedArticle.value =
    item.artikel || '';


  product.dataset.article =
    item.artikel || '';


  product.dataset.barcode =
    item.barcode || '';


  product.dataset.nama =
    item.nama || '';


  product.dataset.oum =
    item.oum || '';


  const dropdown =
    product.querySelector(
      '.dropdown'
    );


  dropdown.classList.remove(
    'show'
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   CLOSE DROPDOWN
===================================================== */

document.addEventListener(
  'click',
  function(event){

    if(
      !event.target.closest(
        '.search'
      )
    ){

      document
        .querySelectorAll(
          '.dropdown'
        )
        .forEach(
          function(dropdown){

            dropdown.classList.remove(
              'show'
            );

          }
        );

    }

  }
);


/* =====================================================
   START
===================================================== */

loadMaster();

</script>


</body>

</html>
