<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Z-FOOD</title>


  <style>

    *{
      box-sizing:border-box;
    }


    body{
      margin:0;
      padding:12px;

      background:#f6f7f9;

      font-family:
        Arial,
        sans-serif;

      color:#252525;
    }


    .container{
      width:100%;
      max-width:680px;
      margin:auto;
    }


    .header{
      background:#fff;

      padding:15px;

      border-radius:12px;

      margin-bottom:10px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.06);
    }


    .title{
      margin:0;

      font-size:23px;

      font-weight:700;

      color:#e87516;
    }


    .subtitle{
      margin-top:4px;

      font-size:12px;

      color:#858585;
    }


    .card{
      background:#fff;

      padding:14px;

      border-radius:12px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.06);
    }


    .status{
      display:flex;

      align-items:center;

      gap:8px;

      padding:10px 11px;

      border-radius:9px;

      background:#fff4e8;

      color:#e87516;

      font-size:13px;

      font-weight:600;

      margin-bottom:12px;
    }


    .dot{
      width:9px;
      height:9px;

      flex:none;

      border-radius:50%;

      background:#e87516;
    }


    .dot.loading{
      animation:
        pulse 1s infinite;
    }


    .dot.success{
      background:#24a35a;
    }


    .dot.error{
      background:#d93025;
    }


    @keyframes pulse{

      0%{
        opacity:.3;
      }

      50%{
        opacity:1;
      }

      100%{
        opacity:.3;
      }

    }


    .search{
      position:relative;

      margin-top:12px;
    }


    .search input{
      width:100%;

      height:40px;

      padding:
        0 12px;

      border:
        1px solid #ddd;

      border-radius:9px;

      outline:none;

      font-size:14px;

      background:#fff;
    }


    .search input:focus{
      border-color:#e87516;
    }


    .dropdown{
      display:none;

      position:absolute;

      left:0;
      right:0;

      top:44px;

      z-index:20;

      background:#fff;

      border:
        1px solid #ddd;

      border-radius:9px;

      box-shadow:
        0 5px 15px
        rgba(0,0,0,.10);

      max-height:220px;

      overflow-y:auto;
    }


    .dropdown.show{
      display:block;
    }


    .item{
      padding:9px 11px;

      border-bottom:
        1px solid #f0f0f0;

      cursor:pointer;
    }


    .item:last-child{
      border-bottom:0;
    }


    .item:active{
      background:#fff4e8;
    }


    .item-name{
      font-size:13px;

      font-weight:600;
    }


    .item-detail{
      margin-top:3px;

      font-size:11px;

      color:#888;
    }


    .empty{
      padding:12px;

      color:#888;

      font-size:12px;

      text-align:center;
    }


    .result{
      display:none;

      margin-top:12px;

      border:
        1px solid #eee;

      border-radius:9px;

      overflow:hidden;
    }


    .result.show{
      display:block;
    }


    .result-row{
      display:flex;

      justify-content:
        space-between;

      gap:15px;

      padding:9px 11px;

      border-bottom:
        1px solid #eee;

      font-size:13px;
    }


    .result-row:last-child{
      border-bottom:0;
    }


    .result-label{
      color:#777;
    }


    .result-value{
      font-weight:600;

      text-align:right;

      word-break:
        break-word;
    }


    .error{
      display:none;

      margin-top:10px;

      padding:10px;

      background:#fff0f0;

      color:#c62828;

      border-radius:8px;

      font-size:12px;

      line-height:1.5;

      word-break:
        break-word;
    }


    .error.show{
      display:block;
    }


    .info{
      margin-top:10px;

      font-size:11px;

      color:#888;

      text-align:center;
    }


    @media(max-width:480px){

      body{
        padding:9px;
      }

      .header{
        padding:13px;
      }

      .card{
        padding:12px;
      }

      .title{
        font-size:21px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1 class="title">
      Z-FOOD
    </h1>

    <div class="subtitle">
      Master Product
    </div>

  </div>


  <div class="card">


    <div class="status">

      <span
        id="statusDot"
        class="dot loading"
      ></span>

      <span id="statusText">
        Menghubungkan ke Master...
      </span>

    </div>


    <div class="search">

      <input
        id="searchInput"
        type="text"
        placeholder="ARTICLE / BARCODE / NAMA BARANG"
        autocomplete="off"
        disabled
      >

      <div
        id="dropdown"
        class="dropdown"
      ></div>

    </div>


    <div
      id="result"
      class="result"
    >

      <div class="result-row">

        <span class="result-label">
          Article
        </span>

        <span
          id="rArticle"
          class="result-value"
        >
          -
        </span>

      </div>


      <div class="result-row">

        <span class="result-label">
          Barcode
        </span>

        <span
          id="rBarcode"
          class="result-value"
        >
          -
        </span>

      </div>


      <div class="result-row">

        <span class="result-label">
          Nama Barang
        </span>

        <span
          id="rNama"
          class="result-value"
        >
          -
        </span>

      </div>


      <div class="result-row">

        <span class="result-label">
          OUM
        </span>

        <span
          id="rOum"
          class="result-value"
        >
          -
        </span>

      </div>

    </div>


    <div
      id="error"
      class="error"
    ></div>


    <div
      id="info"
      class="info"
    >
      Memuat data Master...
    </div>


  </div>


</div>


<script>


/* =====================================================
   URL BACKEND APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzVdHeD20QG6_gZmm23TdNgBIEdVSOkiBwxoIWy-Nmt9a_3GTJUWcHCcuDkQb-MxmCygw/exec';


/* =====================================================
   DATA MASTER
===================================================== */

let MASTER_DATA = [];


/* =====================================================
   ELEMENT
===================================================== */

const statusDot =
  document.getElementById(
    'statusDot'
  );

const statusText =
  document.getElementById(
    'statusText'
  );

const searchInput =
  document.getElementById(
    'searchInput'
  );

const dropdown =
  document.getElementById(
    'dropdown'
  );

const result =
  document.getElementById(
    'result'
  );

const errorBox =
  document.getElementById(
    'error'
  );

const info =
  document.getElementById(
    'info'
  );


/* =====================================================
   LOAD MASTER JSONP
===================================================== */

function loadMaster(){

  const callbackName =
    '__zfood_master_' +
    Date.now();


  let finished = false;


  window[callbackName] =
    function(response){

      if(finished){
        return;
      }

      finished = true;


      try{

        delete window[callbackName];


        if(
          !response ||
          response.success !== true
        ){

          showError(
            response &&
            response.error
              ? response.error
              : 'Data Master tidak valid.'
          );

          return;
        }


        MASTER_DATA =
          Array.isArray(response.data)
            ? response.data
            : [];


        statusDot.className =
          'dot success';


        statusText.textContent =
          'Master berhasil terhubung';


        searchInput.disabled =
          false;


        info.textContent =
          MASTER_DATA.length
            .toLocaleString('id-ID') +
          ' data Master berhasil dimuat.';


      }catch(error){

        showError(
          error.message
        );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  const separator =
    APPS_SCRIPT_URL.includes('?')
      ? '&'
      : '?';


  script.src =
    APPS_SCRIPT_URL +
    separator +
    'callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  script.async = true;


  script.onerror =
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showError(
        'Tidak dapat menghubungi Apps Script.'
      );

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function(){

      if(finished){
        return;
      }

      finished = true;

      delete window[callbackName];

      showError(
        'Koneksi ke Apps Script timeout.'
      );

    },
    20000
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  statusDot.className =
    'dot error';


  statusText.textContent =
    'Gagal terhubung ke Master';


  errorBox.textContent =
    message;


  errorBox.classList.add(
    'show'
  );


  info.textContent =
    'Periksa koneksi Apps Script.';

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  'input',
  function(){

    const keyword =
      this.value
        .trim()
        .toLowerCase();


    if(!keyword){

      dropdown.classList.remove(
        'show'
      );

      return;
    }


    const results =
      MASTER_DATA
        .filter(function(item){

          return (

            String(
              item.artikel || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.barcode || ''
            )
              .toLowerCase()
              .includes(keyword)

            ||

            String(
              item.nama || ''
            )
              .toLowerCase()
              .includes(keyword)

          );

        })
        .slice(0,30);


    renderDropdown(
      results
    );

  }
);


/* =====================================================
   DROPDOWN
===================================================== */

function renderDropdown(items){

  dropdown.innerHTML =
    '';


  if(!items.length){

    dropdown.innerHTML =
      '<div class="empty">' +
      'Produk tidak ditemukan' +
      '</div>';

    dropdown.classList.add(
      'show'
    );

    return;
  }


  items.forEach(
    function(item){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'item';


      div.innerHTML =

        '<div class="item-name">' +
        escapeHTML(
          item.nama || '-'
        ) +
        '</div>' +

        '<div class="item-detail">' +
        'Article: ' +
        escapeHTML(
          item.artikel || '-'
        ) +
        ' &nbsp; | &nbsp; ' +
        'Barcode: ' +
        escapeHTML(
          item.barcode || '-'
        ) +
        ' &nbsp; | &nbsp; ' +
        'OUM: ' +
        escapeHTML(
          item.oum || '-'
        ) +
        '</div>';


      div.addEventListener(
        'click',
        function(){

          selectProduct(
            item
          );

        }
      );


      dropdown.appendChild(
        div
      );

    }
  );


  dropdown.classList.add(
    'show'
  );

}


/* =====================================================
   SELECT PRODUCT
===================================================== */

function selectProduct(item){

  searchInput.value =
    item.artikel || '';


  dropdown.classList.remove(
    'show'
  );


  result.classList.add(
    'show'
  );


  document.getElementById(
    'rArticle'
  ).textContent =
    item.artikel || '-';


  document.getElementById(
    'rBarcode'
  ).textContent =
    item.barcode || '-';


  document.getElementById(
    'rNama'
  ).textContent =
    item.nama || '-';


  document.getElementById(
    'rOum'
  ).textContent =
    item.oum || '';

}


/* =====================================================
   CLOSE DROPDOWN
===================================================== */

document.addEventListener(
  'click',
  function(event){

    if(
      !event.target.closest(
        '.search'
      )
    ){

      dropdown.classList.remove(
        'show'
      );

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   START
===================================================== */

loadMaster();

</script>


</body>

</html>
