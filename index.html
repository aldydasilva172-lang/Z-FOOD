<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Z-FOOD</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      background:#f6f7f9;
      font-family:
        Arial,
        sans-serif;
      color:#252525;
    }

    .container{
      width:100%;
      max-width:680px;
      margin:auto;
    }

    .header{
      background:#fff;
      border-radius:12px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .title{
      font-size:22px;
      font-weight:700;
      color:#e87516;
      margin:0;
    }

    .subtitle{
      font-size:12px;
      color:#7a7f86;
      margin-top:4px;
    }

    .card{
      background:#fff;
      border-radius:12px;
      padding:16px;
      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .status{
      display:flex;
      align-items:center;
      gap:9px;
      padding:11px 12px;
      border-radius:9px;
      background:#fff4e8;
      color:#e87516;
      font-size:13px;
      font-weight:600;
      margin-bottom:14px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#e87516;
      flex-shrink:0;
    }

    .dot.loading{
      animation:pulse 1s infinite;
    }

    .dot.success{
      background:#25a55f;
    }

    .dot.error{
      background:#d93025;
    }

    @keyframes pulse{
      0%{
        opacity:.35;
      }
      50%{
        opacity:1;
      }
      100%{
        opacity:.35;
      }
    }

    .result{
      display:none;
    }

    .result.show{
      display:block;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:9px 0;
      border-bottom:1px solid #eee;
      font-size:13px;
    }

    .row:last-child{
      border-bottom:0;
    }

    .label{
      color:#777;
    }

    .value{
      font-weight:600;
      text-align:right;
      word-break:break-word;
    }

    .error{
      margin-top:12px;
      padding:11px;
      border-radius:8px;
      background:#fff0f0;
      color:#c62828;
      font-size:12px;
      line-height:1.5;
      word-break:break-word;
    }

    .info{
      margin-top:14px;
      padding:10px 12px;
      background:#f5f6f8;
      border-radius:8px;
      font-size:12px;
      color:#666;
      line-height:1.5;
    }

    @media(max-width:480px){

      body{
        padding:10px;
      }

      .header{
        padding:13px;
      }

      .card{
        padding:12px;
      }

      .title{
        font-size:20px;
      }

    }

  </style>

</head>


<body>

<div class="container">


  <div class="header">

    <div class="title">
      Z-FOOD
    </div>

    <div class="subtitle">
      Master Connection
    </div>

  </div>


  <div class="card">

    <div
      id="status"
      class="status"
    >

      <span
        id="statusDot"
        class="dot loading"
      ></span>

      <span id="statusText">
        Menghubungkan ke Master...
      </span>

    </div>


    <div
      id="result"
      class="result"
    >

      <div class="row">

        <span class="label">
          Status
        </span>

        <span
          id="resultStatus"
          class="value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="label">
          Jumlah Master
        </span>

        <span
          id="resultTotal"
          class="value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="label">
          Article
        </span>

        <span
          id="resultArticle"
          class="value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="label">
          Barcode
        </span>

        <span
          id="resultBarcode"
          class="value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="label">
          Nama Barang
        </span>

        <span
          id="resultNama"
          class="value"
        >
          -
        </span>

      </div>


      <div class="row">

        <span class="label">
          OUM
        </span>

        <span
          id="resultOum"
          class="value"
        >
          -
        </span>

      </div>

    </div>


    <div
      id="errorBox"
      class="error"
      style="display:none"
    ></div>


    <div
      id="info"
      class="info"
    >
      Sedang mengambil data dari Google Spreadsheet...
    </div>

  </div>

</div>


<script>

/* =====================================================
   MASUKKAN URL APPS SCRIPT DI SINI
===================================================== */

const APPS_SCRIPT_URL =
  'PASTE_URL_APPS_SCRIPT_DISINI';


/* =====================================================
   LOAD MASTER
===================================================== */

function loadMaster(){

  const callbackName =
    'zfoodMasterCallback_' +
    Date.now();


  window[callbackName] =
    function(response){

      try{

        delete window[callbackName];


        if(!response){

          showError(
            'Apps Script mengembalikan respons kosong.'
          );

          return;
        }


        if(!response.success){

          showError(
            response.error ||
            'Terjadi error pada Apps Script.'
          );

          return;
        }


        const data =
          Array.isArray(response.data)
            ? response.data
            : [];


        showSuccess(data);


      }catch(error){

        showError(
          error.message
        );

      }

    };


  const script =
    document.createElement('script');


  script.src =
    APPS_SCRIPT_URL +
    '?callback=' +
    encodeURIComponent(callbackName);


  script.async = true;


  script.onerror =
    function(){

      delete window[callbackName];

      showError(
        'Tidak dapat menghubungi Apps Script.'
      );

    };


  document.body.appendChild(script);


  /*
   * Timeout
   */

  setTimeout(function(){

    if(
      typeof window[callbackName] ===
      'function'
    ){

      delete window[callbackName];

      showError(
        'Koneksi timeout. Apps Script tidak memberikan respons.'
      );

    }

  },15000);

}


/* =====================================================
   BERHASIL
===================================================== */

function showSuccess(data){

  const dot =
    document.getElementById(
      'statusDot'
    );

  const text =
    document.getElementById(
      'statusText'
    );


  dot.className =
    'dot success';


  text.textContent =
    'Berhasil terhubung ke Master';


  document.getElementById(
    'result'
  ).classList.add('show');


  document.getElementById(
    'resultStatus'
  ).textContent =
    'CONNECTED';


  document.getElementById(
    'resultTotal'
  ).textContent =
    data.length.toLocaleString(
      'id-ID'
    );


  if(data.length > 0){

    const first =
      data[0];


    document.getElementById(
      'resultArticle'
    ).textContent =
      first.artikel || '-';


    document.getElementById(
      'resultBarcode'
    ).textContent =
      first.barcode || '-';


    document.getElementById(
      'resultNama'
    ).textContent =
      first.nama || '-';


    document.getElementById(
      'resultOum'
    ).textContent =
      first.oum || '-';

  }


  document.getElementById(
    'info'
  ).textContent =
    'Data Master berhasil dimuat ke browser.';


}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  const dot =
    document.getElementById(
      'statusDot'
    );

  const text =
    document.getElementById(
      'statusText'
    );


  dot.className =
    'dot error';


  text.textContent =
    'Gagal terhubung ke Master';


  const box =
    document.getElementById(
      'errorBox'
    );


  box.style.display =
    'block';


  box.textContent =
    message;


  document.getElementById(
    'info'
  ).textContent =
    'Periksa URL Apps Script dan deployment.';

}


/* =====================================================
   MULAI
===================================================== */

window.addEventListener(
  'load',
  loadMaster
);

</script>

</body>

</html>
