<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Z-FOOD</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:10px;
  background:#f6f7f9;
  font-family:Arial,sans-serif;
  color:#252525;
}

.container{
  width:100%;
  max-width:680px;
  margin:auto;
}

/* =====================================================
   HEADER
===================================================== */

.header{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.title{
  margin:0;
  font-size:22px;
  font-weight:700;
  color:#e87516;
}

.subtitle{
  margin-top:3px;
  font-size:11px;
  color:#858585;
}


/* =====================================================
   STATUS
===================================================== */

.status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  margin-bottom:10px;
  border-radius:8px;
  background:#fff8ef;
  color:#e87516;
  font-size:12px;
  font-weight:600;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e87516;
  flex:none;
}


/* =====================================================
   SECTION
===================================================== */

.section{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.section-header{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  min-height:24px;
}

.section-title{
  width:100%;
  text-align:center;
  font-size:15px;
  font-weight:700;
}

.section-count{
  position:absolute;
  right:0;
  font-size:10px;
  color:#999;
}


/* =====================================================
   PRODUCT INPUT
===================================================== */

.product{
  position:relative;
  padding:10px;
  margin-bottom:8px;
  border:1px solid #e8e8e8;
  border-radius:10px;
  background:#fff;
}

.product-title{
  padding-right:30px;
  margin-bottom:9px;
  font-size:11px;
  font-weight:700;
  color:#777;
}


/* =====================================================
   REMOVE
===================================================== */

.remove-btn{
  position:absolute;
  top:8px;
  right:8px;
  width:25px;
  height:25px;
  padding:0;
  border:0;
  border-radius:7px;
  background:#fff0f0;
  color:#d93025;
  font-size:17px;
  line-height:25px;
  cursor:pointer;
}

.remove-btn:active{
  transform:scale(.95);
}


/* =====================================================
   SEARCH
===================================================== */

.search{
  position:relative;
  margin-bottom:9px;
}

.search-label,
.quantity-label{
  display:block;
  margin-bottom:4px;
  font-size:10px;
  font-weight:600;
  color:#777;
}

.search-input{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  outline:none;
  font-size:13px;
  color:#222;
}

.search-input:focus{
  border-color:#e87516;
  box-shadow:0 0 0 2px rgba(232,117,22,.08);
}


/* =====================================================
   DROPDOWN
===================================================== */

.dropdown{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:43px;
  z-index:999;
  max-height:190px;
  overflow-y:auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}

.dropdown.show{
  display:block;
}

.item{
  padding:9px 10px;
  border-bottom:1px solid #f0f0f0;
  cursor:pointer;
}

.item:last-child{
  border-bottom:0;
}

.item:active{
  background:#fff4e8;
}

.item-name{
  font-size:12px;
  font-weight:600;
  line-height:1.35;
}

.item-detail{
  margin-top:3px;
  font-size:10px;
  color:#888;
  line-height:1.3;
}

.empty{
  padding:12px;
  text-align:center;
  font-size:11px;
  color:#888;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity{
  margin-bottom:4px;
}

.quantity-input{
  width:100%;
  height:38px;
  padding:0 10px;
  border:1px solid #ddd;
  border-radius:8px;
  outline:none;
  font-size:13px;
  background:#fff;
}

.quantity-input:focus{
  border-color:#e87516;
  box-shadow:0 0 0 2px rgba(232,117,22,.08);
}


/* =====================================================
   DATA PRODUK GABUNGAN
===================================================== */

.data-product{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #eee;
}

.data-product-title{
  margin-bottom:6px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  color:#777;
}

.data-table{
  width:100%;
  border:1px solid #e8e8e8;
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

.data-row{
  display:grid;
  grid-template-columns:
    1fr
    1.8fr
    .9fr
    .7fr;
}

.data-cell{
  min-width:0;
  padding:7px 6px;
  border-right:1px solid #e8e8e8;
  border-bottom:1px solid #e8e8e8;
  font-size:10px;
  line-height:1.3;
  word-break:break-word;
}

.data-cell:last-child{
  border-right:0;
}

.data-row:last-child .data-cell{
  border-bottom:0;
}

.data-head{
  background:#f7f7f7;
  font-weight:700;
  color:#777;
}

.data-value{
  min-height:30px;
  display:flex;
  align-items:center;
  font-weight:600;
  color:#333;
}

.data-empty{
  padding:10px;
  text-align:center;
  font-size:10px;
  color:#aaa;
}


/* =====================================================
   ADD
===================================================== */

.add-btn{
  width:100%;
  height:36px;
  margin-top:10px;
  border:1px dashed #e87516;
  border-radius:8px;
  background:#fffaf5;
  color:#e87516;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.add-btn:active{
  transform:scale(.99);
}


/* =====================================================
   SAVE
===================================================== */

.save-section{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.save-btn{
  width:100%;
  height:42px;
  border:0;
  border-radius:9px;
  background:#e87516;
  color:#fff;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(232,117,22,.20);
}

.save-btn:active{
  transform:scale(.99);
}

.save-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}


/* =====================================================
   PREVIEW
===================================================== */

.preview{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f7f8fa;
  border:1px solid #eee;
}

.preview.show{
  display:block;
}

.preview-title{
  margin-bottom:7px;
  font-size:11px;
  font-weight:700;
  color:#555;
}

.preview-data{
  margin:0;
  white-space:pre-wrap;
  word-break:break-word;
  font-family:monospace;
  font-size:10px;
  line-height:1.5;
  color:#555;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

  body{
    padding:8px;
  }

  .header{
    padding:13px;
  }

  .section,
  .save-section{
    padding:10px;
  }

  .product{
    padding:9px;
  }

  .data-cell{
    padding:7px 5px;
    font-size:9px;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1 class="title">
      Z-FOOD
    </h1>

    <div class="subtitle">
      Product Conversion
    </div>

  </div>


  <!-- =================================================
       MASTER STATUS
  ================================================== -->

  <div
    id="masterStatusBox"
    class="status"
  >

    <span
      id="statusDot"
      class="dot"
    ></span>

    <span id="masterStatus">
      Menghubungkan ke Master...
    </span>

  </div>


  <!-- =================================================
       PRODUK AWAL
  ================================================== -->

  <div class="section">

    <div class="section-header">

      <div class="section-title">
        PRODUK AWAL
      </div>

      <div
        id="awalCount"
        class="section-count"
      >
        0 produk
      </div>

    </div>


    <!-- INPUT PRODUK -->
    <div id="awalList"></div>


    <!-- DATA PRODUK GABUNGAN -->

    <div class="data-product">

      <div class="data-product-title">
        DATA PRODUK
      </div>

      <div
        id="awalDataTable"
        class="data-table"
      >

        <div class="data-row">

          <div class="data-cell data-head">
            ARTICLE
          </div>

          <div class="data-cell data-head">
            NAMA BARANG
          </div>

          <div class="data-cell data-head">
            QUANTITY
          </div>

          <div class="data-cell data-head">
            OUM
          </div>

        </div>

        <div
          id="awalDataBody"
        >

          <div class="data-empty">
            Belum ada produk
          </div>

        </div>

      </div>

    </div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('awal')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <!-- =================================================
       PRODUK AKHIR
  ================================================== -->

  <div class="section">

    <div class="section-header">

      <div class="section-title">
        PRODUK AKHIR
      </div>

      <div
        id="akhirCount"
        class="section-count"
      >
        0 produk
      </div>

    </div>


    <!-- INPUT PRODUK -->
    <div id="akhirList"></div>


    <!-- DATA PRODUK GABUNGAN -->

    <div class="data-product">

      <div class="data-product-title">
        DATA PRODUK
      </div>

      <div
        id="akhirDataTable"
        class="data-table"
      >

        <div class="data-row">

          <div class="data-cell data-head">
            ARTICLE
          </div>

          <div class="data-cell data-head">
            NAMA BARANG
          </div>

          <div class="data-cell data-head">
            QUANTITY
          </div>

          <div class="data-cell data-head">
            OUM
          </div>

        </div>

        <div
          id="akhirDataBody"
        >

          <div class="data-empty">
            Belum ada produk
          </div>

        </div>

      </div>

    </div>


    <button
      type="button"
      class="add-btn"
      onclick="addProduct('akhir')"
    >
      ＋ TAMBAH PRODUK
    </button>

  </div>


  <!-- =================================================
       SAVE
  ================================================== -->

  <div class="save-section">

    <button
      id="saveBtn"
      type="button"
      class="save-btn"
      onclick="saveData()"
    >
      SIMPAN DATA
    </button>


    <div
      id="preview"
      class="preview"
    >

      <div class="preview-title">
        DATA YANG AKAN DISIMPAN
      </div>

      <pre
        id="previewData"
        class="preview-data"
      ></pre>

    </div>

  </div>


</div>


<script>

/* =====================================================
   APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbzVdHeD20QG6_gZmm23TdNgBIEdVSOkiBwxoIWy-Nmt9a_3GTJUWcHCcuDkQb-MxmCygw/exec';


/* =====================================================
   MASTER
===================================================== */

let MASTER_DATA = [];

let masterLoaded = false;


/* =====================================================
   COUNTER
===================================================== */

let awalCounter = 0;

let akhirCounter = 0;


/* =====================================================
   STATUS
===================================================== */

function setMasterStatus(
  message,
  success
){

  const status =
    document.getElementById(
      'masterStatus'
    );

  const dot =
    document.getElementById(
      'statusDot'
    );

  const box =
    document.getElementById(
      'masterStatusBox'
    );


  status.textContent =
    message;


  if(success){

    dot.style.background =
      '#24a35a';

    box.style.background =
      '#f1fdf5';

    box.style.color =
      '#25834a';

  }else{

    dot.style.background =
      '#d93025';

    box.style.background =
      '#fff0f0';

    box.style.color =
      '#c62828';

  }

}


/* =====================================================
   LOAD MASTER
===================================================== */

function loadMaster(){

  setMasterStatus(
    'Menghubungkan ke Master...',
    true
  );


  const callbackName =
    '__zfood_master_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2);


  let finished = false;


  function finish(){

    if(finished){
      return false;
    }

    finished = true;

    try{
      delete window[callbackName];
    }catch(e){}

    return true;

  }


  window[callbackName] =
    function(response){

      if(!finish()){
        return;
      }


      try{

        if(
          !response ||
          response.success !== true
        ){

          setMasterStatus(
            response &&
            response.error
              ? response.error
              : 'Master tidak dapat dimuat.',
            false
          );

          return;
        }


        if(
          !Array.isArray(
            response.data
          )
        ){

          setMasterStatus(
            'Data Master tidak valid.',
            false
          );

          return;
        }


        MASTER_DATA =
          response.data;


        masterLoaded = true;


        setMasterStatus(
          'Master terhubung • ' +
          MASTER_DATA.length
            .toLocaleString('id-ID') +
          ' data',
          true
        );


        /*
         * Produk pertama otomatis dibuat
         */

        if(
          !document.querySelector(
            '#awalList .product'
          )
        ){

          addProduct('awal');

        }


        if(
          !document.querySelector(
            '#akhirList .product'
          )
        ){

          addProduct('akhir');

        }


      }catch(error){

        setMasterStatus(
          'Error: ' +
          error.message,
          false
        );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.async = true;


  script.src =
    APPS_SCRIPT_URL +
    '?callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  script.onerror =
    function(){

      if(!finish()){
        return;
      }

      setMasterStatus(
        'Gagal menghubungi Apps Script.',
        false
      );

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function(){

      if(!finish()){
        return;
      }

      setMasterStatus(
        'Koneksi Master timeout.',
        false
      );

    },
    20000
  );

}


/* =====================================================
   TAMBAH PRODUK
===================================================== */

function addProduct(type){

  if(!masterLoaded){

    alert(
      'Master masih dimuat. Tunggu sampai status Master terhubung.'
    );

    return;

  }


  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const id =
    type === 'awal'
      ? ++awalCounter
      : ++akhirCounter;


  const product =
    document.createElement(
      'div'
    );


  product.className =
    'product';


  product.dataset.type =
    type;


  product.dataset.id =
    id;


  product.innerHTML = `

    <button
      type="button"
      class="remove-btn"
      onclick="removeProduct(this)"
      title="Hapus produk"
    >
      ×
    </button>


    <div class="product-title">

      ${
        type === 'awal'
          ? 'PRODUK AWAL'
          : 'PRODUK AKHIR'
      }

      #${id}

    </div>


    <div class="search">

      <label class="search-label">
        ARTICLE / BARCODE / NAMA BARANG
      </label>

      <input
        type="text"
        class="search-input"
        placeholder="Ketik atau scan..."
        autocomplete="off"
      >

      <div class="dropdown"></div>

    </div>


    <div class="quantity">

      <label class="quantity-label">
        QUANTITY
      </label>

      <input
        type="number"
        class="quantity-input"
        inputmode="decimal"
        step="any"
        placeholder="Masukkan quantity"
      >

    </div>

  `;


  list.appendChild(
    product
  );


  /* SEARCH */

  const searchInput =
    product.querySelector(
      '.search-input'
    );


  searchInput.addEventListener(
    'input',
    function(){

      searchProduct(
        this
      );

    }
  );


  searchInput.addEventListener(
    'focus',
    function(){

      if(this.value.trim()){

        searchProduct(
          this
        );

      }

    }
  );


  /* QUANTITY */

  const quantityInput =
    product.querySelector(
      '.quantity-input'
    );


  quantityInput.addEventListener(
    'input',
    function(){

      updateQuantity(
        this
      );

    }
  );


  updateCount(
    type
  );


  updateDataTable(
    type
  );

}


/* =====================================================
   HAPUS PRODUK
===================================================== */

function removeProduct(button){

  const product =
    button.closest(
      '.product'
    );


  if(!product){
    return;
  }


  const type =
    product.dataset.type;


  product.remove();


  updateCount(
    type
  );


  updateDataTable(
    type
  );

}


/* =====================================================
   COUNT
===================================================== */

function updateCount(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const count =
    list.querySelectorAll(
      '.product'
    ).length;


  document.getElementById(
    type === 'awal'
      ? 'awalCount'
      : 'akhirCount'
  ).textContent =
    count +
    ' produk';

}


/* =====================================================
   SEARCH MASTER
===================================================== */

function searchProduct(input){

  if(!masterLoaded){
    return;
  }


  const keyword =
    input.value
      .trim()
      .toLowerCase();


  const product =
    input.closest(
      '.product'
    );


  if(!product){
    return;
  }


  const dropdown =
    product.querySelector(
      '.dropdown'
    );


  if(!keyword){

    dropdown.innerHTML =
      '';

    dropdown.classList.remove(
      'show'
    );

    return;

  }


  const results =
    MASTER_DATA
      .filter(
        function(item){

          const artikel =
            String(
              item.artikel || ''
            )
              .toLowerCase();

          const barcode =
            String(
              item.barcode || ''
            )
              .toLowerCase();

          const nama =
            String(
              item.nama || ''
            )
              .toLowerCase();


          return (
            artikel.includes(keyword) ||
            barcode.includes(keyword) ||
            nama.includes(keyword)
          );

        }
      )
      .slice(
        0,
        30
      );


  dropdown.innerHTML =
    '';


  if(!results.length){

    dropdown.innerHTML =
      '<div class="empty">' +
      'Produk tidak ditemukan' +
      '</div>';

    dropdown.classList.add(
      'show'
    );

    return;

  }


  results.forEach(
    function(item){

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'item';


      div.innerHTML =

        '<div class="item-name">' +
        escapeHTML(
          item.nama || '-'
        ) +
        '</div>' +

        '<div class="item-detail">' +
        'Article: ' +
        escapeHTML(
          item.artikel || '-'
        ) +
        ' | Barcode: ' +
        escapeHTML(
          item.barcode || '-'
        ) +
        ' | OUM: ' +
        escapeHTML(
          item.oum || '-'
        ) +
        '</div>';


      div.addEventListener(
        'mousedown',
        function(event){

          event.preventDefault();

          selectProduct(
            product,
            item
          );

        }
      );


      dropdown.appendChild(
        div
      );

    }
  );


  dropdown.classList.add(
    'show'
  );

}


/* =====================================================
   PILIH PRODUK
===================================================== */

function selectProduct(
  product,
  item
){

  if(!product){
    return;
  }


  const searchInput =
    product.querySelector(
      '.search-input'
    );


  searchInput.value =
    item.artikel || '';


  product.dataset.article =
    item.artikel || '';


  product.dataset.barcode =
    item.barcode || '';


  product.dataset.name =
    item.nama || '';


  product.dataset.oum =
    item.oum || '';


  product.querySelector(
    '.dropdown'
  ).classList.remove(
    'show'
  );


  updateDataTable(
    product.dataset.type
  );

}


/* =====================================================
   QUANTITY
===================================================== */

function updateQuantity(input){

  const product =
    input.closest(
      '.product'
    );


  if(!product){
    return;
  }


  updateDataTable(
    product.dataset.type
  );

}


/* =====================================================
   DATA PRODUK
   SATU TABEL UNTUK SEMUA PRODUK
===================================================== */

function updateDataTable(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const body =
    document.getElementById(
      type === 'awal'
        ? 'awalDataBody'
        : 'akhirDataBody'
    );


  const products =
    list.querySelectorAll(
      '.product'
    );


  body.innerHTML =
    '';


  let totalData =
    0;


  products.forEach(
    function(product){

      const data =
        getProductData(
          product
        );


      /*
       * Hanya tampilkan kalau
       * barang sudah dipilih.
       */

      if(
        !data.artikel &&
        !data.nama
      ){
        return;
      }


      totalData++;


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'data-row';


      row.innerHTML = `

        <div class="data-cell data-value">
          ${escapeHTML(
            data.artikel || '-'
          )}
        </div>

        <div class="data-cell data-value">
          ${escapeHTML(
            data.nama || '-'
          )}
        </div>

        <div class="data-cell data-value">
          ${escapeHTML(
            data.quantity || '-'
          )}
        </div>

        <div class="data-cell data-value">
          ${escapeHTML(
            data.oum || '-'
          )}
        </div>

      `;


      body.appendChild(
        row
      );

    }
  );


  if(totalData === 0){

    body.innerHTML =
      '<div class="data-empty">' +
      'Belum ada produk' +
      '</div>';

  }

}


/* =====================================================
   DATA PRODUK
===================================================== */

function getProductData(product){

  return {

    artikel:
      product.dataset.article || '',

    nama:
      product.dataset.name || '',

    quantity:
      product.querySelector(
        '.quantity-input'
      ).value || '',

    oum:
      product.dataset.oum || ''

  };

}


/* =====================================================
   SEMUA PRODUK
===================================================== */

function getAllProducts(type){

  const list =
    document.getElementById(
      type === 'awal'
        ? 'awalList'
        : 'akhirList'
    );


  const products =
    list.querySelectorAll(
      '.product'
    );


  const result = [];


  products.forEach(
    function(product){

      const data =
        getProductData(
          product
        );


      if(
        data.artikel &&
        data.nama &&
        data.quantity &&
        data.oum
      ){

        result.push(
          data
        );

      }

    }
  );


  return result;

}


/* =====================================================
   SIMPAN / PREVIEW
===================================================== */

function saveData(){

  const awal =
    getAllProducts(
      'awal'
    );


  const akhir =
    getAllProducts(
      'akhir'
    );


  if(
    awal.length === 0 &&
    akhir.length === 0
  ){

    alert(
      'Belum ada data produk yang lengkap.'
    );

    return;

  }


  const payload = {

    produkAwal:
      awal,

    produkAkhir:
      akhir

  };


  document.getElementById(
    'previewData'
  ).textContent =
    JSON.stringify(
      payload,
      null,
      2
    );


  document.getElementById(
    'preview'
  ).classList.add(
    'show'
  );


  document.getElementById(
    'preview'
  ).scrollIntoView({
    behavior:'smooth',
    block:'nearest'
  });

}


/* =====================================================
   TUTUP DROPDOWN
===================================================== */

document.addEventListener(
  'click',
  function(event){

    if(
      !event.target.closest(
        '.search'
      )
    ){

      document
        .querySelectorAll(
          '.dropdown'
        )
        .forEach(
          function(dropdown){

            dropdown.classList.remove(
              'show'
            );

          }
        );

    }

  }
);


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   START
===================================================== */

loadMaster();
