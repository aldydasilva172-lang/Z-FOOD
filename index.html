<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Z-FOOD TEST</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      background:#f6f7f9;
      font-family:Arial,sans-serif;
      color:#222;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    h2{
      margin:0 0 15px;
    }

    .status{
      padding:12px;
      border-radius:8px;
      background:#fff4e8;
      color:#e87516;
      margin-bottom:15px;
      word-break:break-word;
    }

    .info{
      background:#f4f5f7;
      padding:12px;
      border-radius:8px;
      margin-bottom:10px;
      font-size:14px;
      line-height:1.6;
    }

    button{
      width:100%;
      height:42px;
      border:0;
      border-radius:8px;
      background:#e87516;
      color:#fff;
      font-weight:bold;
      margin-top:10px;
    }

    #result{
      margin-top:15px;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Z-FOOD</h2>

  <div id="status" class="status">
    Memulai pemeriksaan...
  </div>

  <div id="googleInfo" class="info">
    Mengecek Google Script...
  </div>

  <div id="urlInfo" class="info">
    URL: ...
  </div>

  <button onclick="testMaster()">
    TEST MASTER
  </button>

  <div id="result"></div>

</div>

<script>

function setStatus(text){
  document.getElementById('status').textContent = text;
}

function showResult(text){
  document.getElementById('result').textContent = text;
}


/* =========================
   CEK GOOGLE SCRIPT
========================= */

window.addEventListener('load', function(){

  let googleOK = typeof google !== 'undefined';

  let scriptOK =
    googleOK &&
    typeof google.script !== 'undefined';

  let runOK =
    scriptOK &&
    typeof google.script.run !== 'undefined';

  document.getElementById('googleInfo').textContent =
    'google = ' + googleOK +
    '\ngoogle.script = ' + scriptOK +
    '\ngoogle.script.run = ' + runOK;

  document.getElementById('urlInfo').textContent =
    'URL halaman:\n' + window.location.href;

  if(!googleOK){
    setStatus('ERROR: google tidak tersedia.');
    return;
  }

  if(!scriptOK){
    setStatus('ERROR: google.script tidak tersedia.');
    return;
  }

  if(!runOK){
    setStatus('ERROR: google.script.run tidak tersedia.');
    return;
  }

  setStatus('google.script.run TERSEDIA.');

});


/* =========================
   TEST MASTER
========================= */

function testMaster(){

  setStatus('Menghubungi getMasterData()...');

  showResult('Menunggu respons dari Apps Script...');

  let selesai = false;

  // Timeout 10 detik
  setTimeout(function(){

    if(!selesai){

      selesai = true;

      setStatus('TIMEOUT');

      showResult(
        'Apps Script tidak memberikan respons selama 10 detik.\n\n' +
        'Kemungkinan:\n' +
        '1. Deployment masih memakai versi lama.\n' +
        '2. Web App bukan dari project Apps Script yang sama.\n' +
        '3. google.script.run tidak dapat menjalankan fungsi.\n' +
        '4. Ada masalah authorization/deployment.'
      );

    }

  },10000);


  try{

    google.script.run

      .withSuccessHandler(function(data){

        if(selesai) return;

        selesai = true;

        setStatus('BERHASIL TERHUBUNG KE MASTER');

        if(!Array.isArray(data)){

          showResult(
            'Respons diterima, tetapi bukan Array.\n\n' +
            JSON.stringify(data,null,2)
          );

          return;
        }

        showResult(
          'Jumlah data Master: ' + data.length +
          '\n\nData pertama:\n' +
          JSON.stringify(data[0],null,2)
        );

      })

      .withFailureHandler(function(error){

        if(selesai) return;

        selesai = true;

        setStatus('ERROR DARI APPS SCRIPT');

        showResult(
          'Nama error:\n' +
          (error && error.name ? error.name : '-') +

          '\n\nPesan error:\n' +
          (error && error.message ? error.message : error) +

          '\n\nDetail:\n' +
          JSON.stringify(error,null,2)
        );

      })

      .getMasterData();

  }catch(error){

    selesai = true;

    setStatus('ERROR JAVASCRIPT');

    showResult(
      'Error:\n' +
      error.message +
      '\n\n' +
      error.stack
    );

  }

}

</script>

</body>
</html>
